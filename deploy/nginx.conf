# Load balancer in front of all "api" containers.
# Docker's DNS returns one address per container; nginx sends each request to the least busy one.
upstream weather_api {
    least_conn;
    server api:8000;
}

server {
    listen 80;
    client_max_body_size 100m;          # bulk uploads

    location / {
        proxy_pass http://weather_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
