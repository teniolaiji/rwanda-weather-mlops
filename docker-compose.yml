# Load-balanced setup for the Locust experiments:
#   docker compose up -d --build --scale api=3
# Nginx spreads requests across however many "api" containers are running.
services:
  api:
    build: .
    image: rwanda-weather-api
    environment:
      RETRAIN_THRESHOLD: "50"
      # one CPU core per container, like one small cloud instance each,
      # so adding containers adds real capacity
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
